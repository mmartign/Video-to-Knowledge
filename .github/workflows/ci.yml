name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Video-to-Knowledge
        uses: actions/checkout@v4
        with:
          path: Video-to-Knowledge

      # realtime_video_pipeline.exe expects the openai-cpp headers as a
      # sibling checkout: ../openai-cpp/include/openai (see CMakeLists.txt).
      - name: Checkout openai-cpp headers
        uses: actions/checkout@v4
        with:
          repository: olrea/openai-cpp
          path: openai-cpp

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopencv-dev \
            libcurl4-openssl-dev \
            ninja-build

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: Video-to-Knowledge/build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('Video-to-Knowledge/CMakeLists.txt') }}

      - name: Configure
        working-directory: Video-to-Knowledge
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: Video-to-Knowledge
        run: cmake --build build

      - name: Run unit tests
        working-directory: Video-to-Knowledge
        run: ctest --test-dir build --output-on-failure
